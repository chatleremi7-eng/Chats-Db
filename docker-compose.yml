version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chat_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: chat_backend_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/chat_db
      JWT_SECRET: super_secret_jwt_key_sobriva_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: "*"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
